<div class="page" data-name="delay_go" class="">

  <div class="popup input-alamat-kirim-delay">
    <div class="view">
      <div class="page">
        <div class="navbar">
          <div class="navbar-bg"></div>
          <div class="navbar-inner bg-dark-gray-medium">
            <div class="title">Alamat <span id="nama-client-alamat-delay"></span></div>
            <div class="right">
              <!-- Link to close popup -->
              <p id="back-input-alamat-kirim-delay" class="text-add-colour-white link popup-close"
                data-popup=".input-alamat-kirim-delay">
                <i style="margin-right:5px;" class="f7-icons">xmark_rectangle_fill</i>
              </p>
            </div>
          </div>
        </div>
        <div class="page-content">
          <form id="input_alamat_kirim_delay_popup">
            <div class="list" style="margin-top: 10px;">
              <ul style="padding: 10px;">
                <li class="item-content item-input">
                  <div class="item-inner">
                    <label style="height:17px;"><b>Foto Produksi Selesai</b></label>
                    <div class="item-input-wrap">
                      <center>
                        <img onclick="zoom_view_foto_bayar(this.src);" width="200px"
                          style="border-radius:10px;margin-top:5px;" id="file_foto_produksi_selesai_delay_view" />
                        <br>
                      </center>
                    </div>
                  </div>
                </li>
                <li class="item-content item-input">
                  <div class="item-inner">
                    <label style="height:17px; margin-top:-9px;"><b>Alamat Awal</b></label>
                    <div class="item-input-wrap">
                      <label></label>
                      <input type="text" id="alamat_sekarang_delay_popup" name="alamat_sekarang_delay_popup" required
                        readonly disabled validate>
                      <input type="hidden" id="penjualan_id_delay_alamat" name="penjualan_id_delay_alamat" required
                        validate>
                      <input type="hidden" id="client_id_delay_alamat" name="client_id_delay_alamat" required validate>
                      <input type="hidden" id="karyawan_id_delay_alamat" name="karyawan_id_delay_alamat" required
                        validate>
                    </div>
                  </div>
                </li>
                <li class="item-content item-input">
                  <div class="item-inner">
                    <label style="height:17px; margin-top:-9px;"><b>Kota</b></label>
                    <div class="item-input-wrap">
                      <label></label>
                      <input type="text" id="kota_kirim_delay_popup" name="kota_kirim_delay_popup" required readonly
                        disabled validate>
                      <span class="input-clear-button"></span>
                    </div>
                  </div>
                </li>
                <li class="item-content item-input">
                  <div class="item-inner">
                    <label style="height:17px; margin-top:-9px;"><b>No Hp.</b></label>
                    <div class="item-input-wrap">
                      <label></label>
                      <input type="text" id="hp_delay_alamat" name="hp_delay_alamat" required readonly disabled
                        validate>
                      <span class="input-clear-button"></span>
                    </div>
                  </div>
                </li>
                <li class="item-content item-input">
                  <div class="item-inner">
                    <label style="height:17px; margin-top:-9px;"><b>Alamat Kirim</b></label>
                    <div class="item-input-wrap">
                      <label></label>
                      <textarea type="text" value="" id="alamat_kirim_delay_popup" readonly disabled
                        name="alamat_kirim_delay_popup" required validate></textarea>
                    </div>
                  </div>
                </li>
                <li class="item-content item-input">
                  <div class="item-inner">
                    <label style="height:17px; margin-top:-9px;"><b>Tgl Kirim</b></label>
                    <div class="item-input-wrap">
                      <label></label>
                      <input type="text" id="tgl_kirim_cabang_delay" name="tgl_kirim_cabang_delay" required readonly
                        validate>
                      <span class="input-clear-button"></span>
                    </div>
                  </div>
                </li>
                <li class="item-content item-input">
                  <div class="item-inner">
                    <label style="height:17px; margin-top:-9px;"><b>Tgl Req Kirim</b></label>
                    <div class="item-input-wrap">
                      <label></label>
                      <input type="text" id="tgl_req_kirim_cabang_delay" name="tgl_req_kirim_cabang_delay" required readonly
                        validate>
                      <span class="input-clear-button"></span>
                    </div>
                  </div>
                </li>
                <li class="item-content item-input">
                  <div class="item-inner">
                    <label style="height:17px; margin-top:-9px;"><b>Keterangan</b></label>
                    <div class="item-input-wrap">
                      <textarea type="text" value="" placeholder="Isi Keterangan" id="keterangan_cabang_delay"
                        name="keterangan_cabang_delay" readonly required validate></textarea>
                      <span class="input-clear-button"></span>
                    </div>
                  </div>
                </li>
              </ul>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Scrollable page content-->
  <div class="page-content theme-dark">
    <!-- In data-popup attribute we specify CSS selector of popup we need to open -->
    <!-- And somewhere in DOM -->

    <div class="card">
      <div style="text-align: center;" class="row no-gap bg-dark-gray-young">
        <div class="col col-border text-bold"><a class="text-add-colour-white" id="page_sales" href="/Sales">Sales</a>
        </div>
        <div class="col col-border text-bold"><a class="text-add-colour-white" onclick="changeFilterMenu('sales',0);"
            href="/client">Broadcast</a>
        </div>
        <div class="col col-bordertext-bold"><a class="text-add-colour-white"
            onclick="changeFilterMenuNotif('proforma');" href="/notif">Notif</a>
        </div>
        <div class="col col-border bg-dark-gray-medium text-bold"><a class="text-add-colour-white"
            href="/delay-go">Delay - Go</a></div>
        <div class="col col-border text-bold"><a class="text-add-colour-white" href="/kpi">KPI</a>
        </div>
        <div class="col col-border text-bold "><a class="text-add-colour-white" href="/tools">Tools</a>
        </div>
        <div class="col col-border text-bold "><a class="text-add-colour-white" href="/point-sales">Point</a>
        </div>
        <div class="col col-border text-bold"><a class="text-add-colour-white" href="/katalog">Katalog</a></div>
      </div>
      <div class="row">
        <div style="overflow-x:auto; width:100%;margin-top:5px;">
          <table align="center" width="100%" border="0" style="border-collapse: collapse; border:1px solid gray;">
            <tr>
              <td align="center" width="5%"
                style="border-left:1px solid gray;  border-right:1px solid gray; border-bottom:1px solid gray;"
                class="label-cell bg-dark-gray-young">No</td>
              <td align="center" width="15%"
                style="border-left:1px solid gray;  border-right:1px solid gray; border-bottom:1px solid gray;"
                class="label-cell bg-dark-gray-young">SPK</td>
              <td align="center" width="15%"
                style="border-left:1px solid gray;  border-right:1px solid gray; border-bottom:1px solid gray;"
                class="label-cell bg-dark-gray-young">Client</td>
              <td align="center" width="10%"
                style="border-left:1px solid gray;  border-right:1px solid gray; border-bottom:1px solid gray;"
                class="label-cell bg-dark-gray-young">Kota</td>
              <td align="center" width="10%"
                style="border-left:1px solid gray;  border-right:1px solid gray; border-bottom:1px solid gray;"
                class="label-cell bg-dark-gray-young">Tgl Kirim</td>
              <td align="center" width="10%"
                style="border-left:1px solid gray;  border-right:1px solid gray; border-bottom:1px solid gray;"
                class="label-cell bg-dark-gray-young">Tgl Req Kirim</td>
              <td align="center" width="10%"
                style="border-left:1px solid gray;  border-right:1px solid gray; border-bottom:1px solid gray;"
                class="label-cell bg-dark-gray-young">No HP</td>
              <td align="center" width="20%"
                style="border-left:1px solid gray;  border-right:1px solid gray; border-bottom:1px solid gray;"
                class="label-cell bg-dark-gray-young">Alamat Kirim</td>
              <td align="center" width="10%"
                style="border-left:1px solid gray;  border-right:1px solid gray; border-bottom:1px solid gray;"
                class="label-cell bg-dark-gray-young">Opsi</td>
            </tr>
            <tbody id="data_status_notif_delay_go">
              <!-- Data will be populated here -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
