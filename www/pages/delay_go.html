        <div class="page-content">

                <li class="item-content item-input">

                    </div>

                <li class="item-content item-input">

                    <div class="item-input-wrap">
                      <label></label>
                      <input type="text" id="alamat_sekarang_delay_popup" name="alamat_sekarang_delay_popup" required

                      <input type="hidden" id="penjualan_id_delay_alamat" name="penjualan_id_delay_alamat" required

                      <input type="hidden" id="client_id_delay_alamat" name="client_id_delay_alamat" required validate>

                    </div>
                  </div>
                </li>
                <li class="item-content item-input">
                  <div class="item-inner">
                    <label style="height:17px; margin-top:-9px;"><b>Kota</b></label>
                    <div class="item-input-wrap">
                      <label></label>
                      <input type="text" id="kota_kirim_delay_popup" name="kota_kirim_delay_popup" required readonly
                        disabled validate>
                      <span class="input-clear-button"></span>
                    </div>
                  </div>
                </li>
                <li class="item-content item-input">
                  <div class="item-inner">
                    <label style="height:17px; margin-top:-9px;"><b>No Hp.</b></label>
                    <div class="item-input-wrap">
                      <label></label>
                      <input type="text" id="hp_delay_alamat" name="hp_delay_alamat" required readonly disabled
                        validate>
                      <span class="input-clear-button"></span>
                    </div>
                  </div>
                </li>
                <li class="item-content item-input">
                  <div class="item-inner">
                    <label style="height:17px; margin-top:-9px;"><b>Alamat Kirim</b></label>
                    <div class="item-input-wrap">
                      <label></label>
                      <textarea type="text" value="" id="alamat_kirim_delay_popup" readonly disabled
                        name="alamat_kirim_delay_popup" required validate></textarea>
                    </div>
                  </div>
                </li>
                <li class="item-content item-input">
                  <div class="item-inner">
                    <label style="height:17px; margin-top:-9px;"><b>Tgl Kirim</b></label>
                    <div class="item-input-wrap">
                      <label></label>
                      <input type="text" id="tgl_kirim_cabang_delay" name="tgl_kirim_cabang_delay" required readonly
                        validate>
                      <span class="input-clear-button"></span>
                    </div>
                  </div>
                </li>
                <li class="item-content item-input">
                  <div class="item-inner">
                    <label style="height:17px; margin-top:-9px;"><b>Tgl Req Kirim</b></label>
                    <div class="item-input-wrap">
                      <label></label>
                      <input type="text" id="tgl_req_kirim_cabang_delay" name="tgl_req_kirim_cabang_delay" required
                        readonly validate>
                      <span class="input-clear-button"></span>
                    </div>
                  </div>
                </li>
                <li class="item-content item-input">
                  <div class="item-inner">
                    <label style="height:17px; margin-top:-9px;"><b>Keterangan</b></label>
                    <div class="item-input-wrap">
                      <textarea type="text" value="" placeholder="Isi Keterangan" id="keterangan_cabang_delay"
                        name="keterangan_cabang_delay" readonly required validate></textarea>
                      <span class="input-clear-button"></span>
                    </div>
                  </div>
                </li>
                <li class="item-content item-input">
                  <div class="item-inner">
                    <label style="height:17px; margin-top:-9px;"><b>Packing</b></label>
                    <div class="item-input-wrap">
                      <label></label>
                      <input type="text" id="packing_notif_alamat" name="packing_notif_alamat" required readonly
                        disabled validate>
                      <span class="input-clear-button"></span>
                    </div>
                  </div>
                </li>
              </ul>
            </div>
          </form>
        </div>
      </div>
    </div>
