<div class="page" data-name="kunjungan-sales" class="">
  <!-- Scrollable page content-->

  <div class="page-content theme-dark">
    <!-- In data-popup attribute we specify CSS selector of popup we need to open -->
    <!-- And somewhere in DOM -->
    <div class="popup update-prospek">
      <div class="view">
        <div class="page">
          <div class="navbar">
            <div class="navbar-bg"></div>
            <div class="navbar-inner bg-dark-gray-medium">
              <div class="title">Detail Prospek</div>
              <div class="right">
                <!-- Link to close popup -->
                <p class="text-add-colour-white link popup-close">
                  <i style="margin-right:5px;" class="f7-icons">xmark_rectangle_fill</i>
                </p>
              </div>
            </div>
          </div>
          <div class="page-content">
            <div class="card card-outline margin-top bg-dark-gray-medium">
              <div class="card-content">
                <div class="row">
                  <div class="col-100">
                    <div class="card">
                      <form id="update_prospek_form">
                        <input style="width:100%;" id="kunjungan_detail_id_update" name="kunjungan_detail_id_update"

                        <div class="card-content" style="overflow-x:auto; width:100%;">
                          <table width="100%" style="border-spacing: 0;">
                            <tbody>
                              <tr>
                                <td style="border-bottom: 1px solid gray;" class="numeric-cell text-align-left">
                                  Perusahaan
                                </td>
                                <td style="border-bottom: 1px solid gray;" class="numeric-cell">:</td>
                                <td align="right" style="border-bottom: 1px solid gray;"
                                  id="popup-prospek-td-client_nama" class="numeric-cell"></td>
                              </tr>
                              <tr>
                                <td style="border-bottom: 1px solid gray;" class="numeric-cell text-align-left">Kota
                                </td>
                                <td style="border-bottom: 1px solid gray;" class="numeric-cell">:</td>
                                <td align="right" style="border-bottom: 1px solid gray;" id="popup-prospek-client_kota"
                                  class="numeric-cell"></td>
                              </tr>
                              <tr>
                                <td style="border-bottom: 1px solid gray;" class="numeric-cell text-align-left">Person
                                </td>
                                <td style="border-bottom: 1px solid gray;" class="numeric-cell">:</td>
                                <td align="right" style="border-bottom: 1px solid gray;"
                                  id="popup-prospek-client_person" class="numeric-cell"></td>
                              </tr>
                              <tr>
                                <td style="border-bottom: 1px solid gray;" class="numeric-cell text-align-left">Posisi
                                </td>
                                <td style="border-bottom: 1px solid gray;" class="numeric-cell">:</td>
                                <td align="right" style="border-bottom: 1px solid gray;"
                                  id="popup-prospek-client_posisi" class="numeric-cell"></td>
                              </tr>
                              <tr>
                                <td style="border-bottom: 1px solid gray;" class="numeric-cell text-align-left">Telpon /
                                  Wa</td>
                                <td style="border-bottom: 1px solid gray;" class="numeric-cell">:</td>
                                <td align="right" style="border-bottom: 1px solid gray;"
                                  id="popup-prospek-client_telpon" class="numeric-cell"></td>
                              </tr>
                              <div class="pertemuan_1_section">
                                <tr>
                                  <td style=" padding-top:9px; padding-bottom:9px;"
                                    class="numeric-cell text-align-left">
                                    Pertemuan <span id="kunjungan_nomer"></span></td>
                                  <td class="numeric-cell">:</td>
                                  <td class="numeric-cell" style="border:1px solid white;">
                                    <input style="  text-align: center; width:100%;" placeholder="Tidak Ada"
                                      id="tanggal_status1_update" readonly
                                      class="data-table numeric-cell prospek-update" type="text"
                                      name="tanggal_status1_update">
                                  </td>
                                </tr>
                                <tr>
                                  <td>
                                    <center>
                                      <img onclick="zoom_view(this.src);" width="100px" style="border-radius:10px;"
                                        id="file_selfie_card_1_view" />
                                      <br>
                                      <font class="keterangan_foto1" style="display:none;">Selfie</font>
                                    </center>
                                  </td>
                                  <td>
                                  </td>
                                  <td>
                                    <center>
                                      <img onclick="zoom_view(this.src);" width="100px" style="border-radius:10px;"
                                        id="file_id_card_1_view" />
                                      <br>
                                      <font class="keterangan_foto1" style="display:none;">ID Card</font>
                                    </center>
                                  </td>
                                </tr>
                                <tr>
                                  <td colspan="3" class="numeric-cell text-align-left">
                                    <textarea readonly
                                      style="padding:10px; width:100%; background-color:lightgray; color:black;"
                                      name="hasil_pertemuan1_update" id="hasil_pertemuan1_update"
                                      class="prospek-update input-item-keterangan-update resizable"></textarea>
                                  </td>
                                </tr>
                              </div>
                            </tbody>
                          </table>
                        </div>
                        <br>
                      </form>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div style="text-align: center;" class="row no-gap bg-dark-gray-young">

        </div>
        <div class="col col-border bg-dark-gray-medium text-bold"><a class="text-add-colour-white" id="page_sales"

        </div>
        <div class="col col-border text-bold  bg-dark-gray-medium"><a class="text-add-colour-white"

        <div class="col col-border text-bold"><a class="text-add-colour-white" href="/prospek">Prospek</a></div>

      <div class="row" style="margin-top: 10px;">
        <div class="col-100">
          <div class="item-content item-input">
            <div class="item-inner">

                  <div class="card-header bg-dark-gray-young">
                    <div class="data-table-title" style="height:5px; margin-left:6px;">
                      <h3 class="margin-15">Prospek : <span id="tgl_prospek"></span></h3>

                    <div>
                      <i class="text-align-right f7-icons" onclick="backToabsensiSales();"

                    </div>
                  </div>
                  <div class="card-content" style="overflow-x:auto; width:100%; height:360px;">
                    <table cellspacing="1" cellpadding="1" width="100%" style="border-color:#1c1c1d;">
                      <thead class="bg-dark-gray-medium text-align-center">

                          <th class="" style="border-bottom :1px solid gray;" width="3%">No</th>

                      </thead>
                      <tbody class="text-align-center" id="prospek_value">

                    </table>

            </div>
          </div>
        </div>
      </div>
    </div>
